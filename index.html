<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNC Monitor Care – Brochure</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f4f7fc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .brochure-wrapper {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            padding: 30px 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
        }

        .embed-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.2225%;
            padding-bottom: 0;
            box-shadow: 0 2px 8px 0 rgba(63, 69, 81, 0.16);
            margin-top: 1.6em;
            margin-bottom: 0.9em;
            overflow: hidden;
            border-radius: 8px;
            will-change: transform;
        }

        .embed-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }

        .credit-link {
            display: block;
            text-align: center;
            font-size: 0.85rem;
            color: #3d4f66;
            margin-top: 8px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .credit-link:hover {
            color: #e67e22;
        }

        .credit-link i {
            margin-right: 4px;
        }

        @media (max-width: 600px) {
            .brochure-wrapper {
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <div class="brochure-wrapper">
        <div class="embed-container">
            <iframe loading="lazy"
                src="https://www.canva.com/design/DAHUnWsSF8I/kmC6yRa2HUmikX5vXCfwMg/view?embed"
                allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
        <a href="https://www.canva.com/design/DAHUnWsSF8I/kmC6yRa2HUmikX5vXCfwMg/view?utm_content=DAHUnWsSF8I&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link"
           target="_blank" rel="noopener" class="credit-link">
            <i class="fas fa-external-link-alt"></i> Copy of Canva Code by Nikil .r
        </a>
    </div>

    <!-- Font Awesome for the credit link icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

</body>
</html>
