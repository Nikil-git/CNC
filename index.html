  <script>
    const form = document.getElementById("service-form");
    const submitButton = document.getElementById("submit-button");
    const statusElement = document.getElementById("request-status");
    let serviceSdkReady = false;

    function showStatus(message, state) {
      statusElement.textContent = message;
      statusElement.dataset.state = state;
      statusElement.classList.remove("hidden");
    }

    function clearStatus() {
      statusElement.textContent = "";
      statusElement.dataset.state = "";
      statusElement.classList.add("hidden");
    }

    const dataHandler = {
      onDataChanged() {
        // This is a privacy-first request form, so submitted records are intentionally not rendered.
      }
    };

    async function initializeRequests() {
      const initResult = await window.dataSdk.init(dataHandler);
      if (initResult.isOk) {
        serviceSdkReady = true;
      } else {
        showStatus("Service requests are temporarily unavailable. Please call us directly.", "error");
      }
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();
      clearStatus();

      if (!form.checkValidity()) {
        form.reportValidity();
        return;
      }

      if (!serviceSdkReady) {
        showStatus("Service requests are temporarily unavailable. Please call us directly.", "error");
        return;
      }

      submitButton.disabled = true;

      const formData = new FormData(form);
      const request = {
        name: String(formData.get("name")).trim(),
        phone: String(formData.get("phone")).trim(),
        email: String(formData.get("email")).trim(),
        machine_model: String(formData.get("machine_model")).trim(),
        service_required: String(formData.get("service_required")).trim(),
        message: String(formData.get("message")).trim(),
        created_at: new Date().toISOString()
      };

      const result = await window.dataSdk.create(request);
      submitButton.disabled = false;

      if (result.isOk) {
        form.reset();
        showStatus("Your service request has been sent. Our team will contact you shortly.", "success");
      } else {
        showStatus("We could not send your request. Please call us at 90433 75600.", "error");
      }
    });

    document.addEventListener("DOMContentLoaded", function() {
      lucide.createIcons();
      initializeRequests();
    });
  </script>
 </body>
</html>
