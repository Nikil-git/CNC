<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CNC Monitor Care – Brochure</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f7fc;
            color: #0b1a2a;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ----- Header / Brand ----- */
        .brand-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .brand-header .logo {
            display: inline-flex;
            align-items: center;
            gap: 14px;
            font-size: 2.2rem;
            font-weight: 700;
            color: #0b2b4a;
            text-decoration: none;
        }

        .brand-header .logo i {
            font-size: 2.8rem;
            color: #e67e22;
        }

        .brand-header .tagline {
            color: #3d4f66;
            font-size: 1rem;
            margin-top: 4px;
            letter-spacing: 0.3px;
        }

        /* ----- Brochure Container ----- */
        .brochure-wrapper {
            max-width: 880px;
            width: 100%;
            background: #ffffff;
            padding: 30px 30px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.04);
            transition: box-shadow 0.3s ease;
        }

        .brochure-wrapper:hover {
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.10);
        }

        .embed-container {
            position: relative;
            width: 100%;
            height: 0;
            padding-top: 56.2225%;
            padding-bottom: 0;
            box-shadow: 0 2px 8px 0 rgba(63, 69, 81, 0.16);
            margin-top: 1.6em;
            margin-bottom: 0.9em;
            overflow: hidden;
            border-radius: 8px;
            will-change: transform;
        }

        .embed-container iframe {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            border: none;
            padding: 0;
            margin: 0;
        }

        .credit-link {
            display: block;
            text-align: center;
            font-size: 0.85rem;
            color: #3d4f66;
            margin-top: 8px;
            transition: color 0.3s ease;
        }

        .credit-link:hover {
            color: #e67e22;
        }

        .credit-link i {
            margin-right: 4px;
        }

        /* ----- Floating Buttons ----- */
        .floating-btns {
            position: fixed;
            bottom: 30px;
            right: 30px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            z-index: 999;
        }

        .floating-btns a {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: #e67e22;
            color: #fff;
            font-size: 1.8rem;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            border: none;
            cursor: pointer;
            text-decoration: none;
        }

        .floating-btns a:hover {
            transform: scale(1.08);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.20);
        }

        .floating-btns .whatsapp {
            background: #25D366;
        }

        .floating-btns .top-btn {
            background: #0b2b4a;
            font-size: 1.5rem;
        }

        /* ----- Footer ----- */
        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: #3d4f66;
            text-align: center;
        }

        .footer a {
            color: #e67e22;
            text-decoration: none;
        }

        /* ----- Responsive ----- */
        @media (max-width: 600px) {
            .brand-header .logo {
                font-size: 1.6rem;
            }
            .brand-header .logo i {
                font-size: 2rem;
            }
            .brochure-wrapper {
                padding: 16px;
            }
            .floating-btns {
                bottom: 20px;
                right: 20px;
            }
            .floating-btns a {
                width: 48px;
                height: 48px;
                font-size: 1.4rem;
            }
        }
    </style>
</head>
<body>

    <!-- ===== BRAND HEADER ===== -->
    <header class="brand-header">
        <a href="#" class="logo">
            <i class="fas fa-desktop"></i>
            <span>CNC Monitor Care</span>
        </a>
        <div class="tagline">Your CNC repair specialists — view our brochure below</div>
    </header>

    <!-- ===== BROCHURE EMBED ===== -->
    <div class="brochure-wrapper">
        <div class="embed-container">
            <iframe loading="lazy"
                src="https://www.canva.com/design/DAHUnWsSF8I/kmC6yRa2HUmikX5vXCfwMg/view?embed"
                allowfullscreen="allowfullscreen" allow="fullscreen">
            </iframe>
        </div>
        <a href="https://www.canva.com/design/DAHUnWsSF8I/kmC6yRa2HUmikX5vXCfwMg/view?utm_content=DAHUnWsSF8I&amp;utm_campaign=designshare&amp;utm_medium=embeds&amp;utm_source=link"
           target="_blank" rel="noopener" class="credit-link">
            <i class="fas fa-external-link-alt"></i> Copy of Canva Code by Nikil .r
        </a>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        &copy; <span id="year"></span> CNC Monitor Care — Coimbatore
    </div>

    <!-- ===== FLOATING BUTTONS ===== -->
    <div class="floating-btns">
        <a href="https://wa.me/919043375600" class="whatsapp" aria-label="WhatsApp"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="top-btn" id="backToTop" aria-label="Back to top"><i class="fas fa-arrow-up"></i></a>
    </div>

    <!-- ===== JAVASCRIPT ===== -->
    <script>
        // Back to Top
        const topBtn = document.getElementById('backToTop');
        topBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Footer year
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>

</body>
</html>
